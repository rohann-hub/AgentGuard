name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  stack:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: cp .env.example .env
      # Test-only agent whose key is "ci-test-agent-key" (see tests/integration).
      - run: echo 'AGENTGUARD_AGENT_API_KEYS={"ci-agent":"538553181642c4ea29db02111516a1d6f32eae7217a2c1334f93ae36a1552b0a"}' >> .env
      - run: docker compose up -d --build --wait
      - run: pytest -m integration
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
