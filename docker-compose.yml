# Development stack. The backend is published on port 8000. OPA and PostgreSQL
# are bound to 127.0.0.1 only, for local debugging; never expose them publicly.
name: agentguard

services:
  backend:
    build: .
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      AGENTGUARD_ENV: ${AGENTGUARD_ENV:-development}
      AGENTGUARD_LOG_LEVEL: ${AGENTGUARD_LOG_LEVEL:-INFO}
      AGENTGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentguard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agentguard}
      AGENTGUARD_OPA_URL: http://opa:8181
      AGENTGUARD_ADMIN_API_KEY_HASH: ${AGENTGUARD_ADMIN_API_KEY_HASH:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started

  opa:
    image: openpolicyagent/opa:1.4.2
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --watch
      - /policies
    volumes:
      - ./config/policies:/policies:ro
    ports:
      - "127.0.0.1:8181:8181"

  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentguard}
      POSTGRES_USER: ${POSTGRES_USER:-agentguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
